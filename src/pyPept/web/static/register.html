<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register Monomer — pyPept</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/register.css">
</head>
<body>
<header>
  <h1 class="title">Register monomer <span>— pyPept</span></h1>
  <a href="/"><svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M7 3L2 8l5 5M2 8h12"/></svg>Back to renderer</a>
</header>

<main class="page">
  <section class="card" aria-labelledby="smiles-step">
    <h2 id="smiles-step">1. Enter SMILES</h2>
    <div class="field">
      <label for="smiles-in">Full monomer SMILES</label>
      <p id="smiles-help" class="field-help">Include all atoms and leaving groups.</p>
      <textarea id="smiles-in" placeholder="e.g.  NCC(=O)O  (glycine)  or  O=C(O)CN1C(=O)C=CC1=O  (Mal-Gly)" spellcheck="false" autocomplete="off" aria-describedby="smiles-help"></textarea>
    </div>
    <button type="button" class="btn btn-primary" id="btn-preview">Preview &amp; detect R-groups</button>
  </section>

  <div id="preview-section">
    <section class="card" aria-labelledby="preview-step">
      <h2 id="preview-step">2. Review detected R-groups</h2>
      <div id="preview-canvas" role="group" aria-label="Monomer preview"><div class="preview-message">Preview the monomer to inspect its attachment sites.</div></div>
      <div id="detected-display" class="detected-types" role="status" aria-live="polite"></div>
      <div class="field">
        <label for="chuckles-out">CHUCKLES</label>
        <p id="chuckles-help" class="field-help">Generated from the previewed SMILES.</p>
        <textarea id="chuckles-out" spellcheck="false" autocomplete="off" readonly aria-describedby="chuckles-help"></textarea>
      </div>
    </section>

    <section class="card" aria-labelledby="metadata-step">
      <h2 id="metadata-step">3. Name and register</h2>
      <div class="field-row">
        <div class="field">
          <label for="abbr-in">Abbreviation (unique token)</label>
          <input id="abbr-in" type="text" placeholder="e.g.  MalGly" autocomplete="off">
        </div>
        <div class="field">
          <label for="name-in">Full name</label>
          <input id="name-in" type="text" placeholder="e.g.  Maleimidoglycine" autocomplete="off">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="type-in">Type</label>
          <select id="type-in">
            <option value="aa">aa</option>
            <option value="cap">cap</option>
            <option value="linker">linker</option>
          </select>
        </div>
        <div class="field">
          <label for="subtype-in">Subtype</label>
          <select id="subtype-in">
            <option value="natural">natural</option>
            <option value="modified">modified</option>
            <option value="cap">cap</option>
            <option value="protecting">protecting</option>
            <option value="label">label</option>
            <option value="linker">linker</option>
          </select>
        </div>
      </div>
      <button type="button" class="btn btn-success" id="btn-register" disabled>Register monomer</button>
      <div id="status-msg" role="status" aria-live="polite" aria-atomic="true"></div>
    </section>
  </div>
</main>

<script src="/static/requests.js" defer></script>
<script src="/static/ui.js" defer></script>
<script src="/static/register.js" defer></script>
</body>
</html>
