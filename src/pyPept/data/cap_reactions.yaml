# --- Alkylation (R2 on C, no carbonyl -> forms C-N) ---

Me_:
  reaction: alkylation
  reagent_lg: I
  reagent_note: methyl iodide (MeI)

Et_:
  reaction: alkylation
  reagent_lg: Br
  reagent_note: ethyl bromide (EtBr)

Bn_:
  reaction: alkylation
  reagent_lg: Br
  reagent_note: benzyl bromide (BnBr)

# --- Alkylation via O/N (unusual N-terminal mods) ---

OBn_:
  reaction: nucleophilic
  reagent_lg: H
  reagent_note: O-benzylhydroxylamine (H2N-OCH2Ph, N-O cap)

OMe_:
  reaction: nucleophilic
  reagent_lg: H
  reagent_note: methoxyamine (H2N-OCH3, N-O cap)

NHBn_:
  reaction: nucleophilic
  reagent_lg: H
  reagent_note: benzylhydrazine (H2N-NHCH2Ph, N-N cap)

# --- Sulfonylation (R2 on S) ---

Tos:
  reaction: sulfonylation
  reagent_lg: Cl
  reagent_note: tosyl chloride (TsCl)

MsO:
  reaction: sulfonylation
  reagent_lg: Cl
  reagent_note: mesyl chloride (MsCl)

