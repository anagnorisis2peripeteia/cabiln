# Canonical reaction chemistry for each cap monomer.
# reaction: acylation | alkylation | sulfonylation | nucleophilic | reductive_amination
# reagent_lg: SMILES of the leaving group on the actual reagent
# reagent_note: common reagent name

# ===================================================================
# R2 CAPS -- N-terminal / electrophilic
# ===================================================================

