name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test browser request lifetimes
        run: node --test tests/test_frontend.js

  browser:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: release-wheel
          path: release
      - name: Install frozen wheel and browser test dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-production.txt
          python -m pip install --no-deps release/dist/*.whl
          python -m pip install -c requirements-production.txt pytest==9.1.1 httpx==0.28.1
          python -m pip check
          npm ci --prefix tests/browser
      - name: Check Linux execution limits in the frozen environment
        run: python -m pytest tests/test_runtime.py tests/test_launch_chemistry.py tests/test_projects.py -q
      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium
      - name: Exercise builder, panels, registration and exports
        working-directory: tests/browser
        env:
          CABILN_PYTHON: python
          CABILN_BROWSER_INSTALLED: '1'
          CABILN_EXECUTION: process
          CABILN_WORKER_MEMORY_MB: '1024'
          CABILN_BROWSER_ARTIFACTS: ${{ runner.temp }}/cabiln-browser
        run: npm test
      - name: Preserve browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: ${{ runner.temp }}/cabiln-browser
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the frozen production image once
        run: docker build --build-arg CABILN_RELEASE=${{ github.sha }} -t cabiln-candidate .
      - name: Test the installed image with production limits
        run: |
          docker run -d --name cabiln-candidate --memory=2g --cpus=1 -p 127.0.0.1:8000:8000 cabiln-candidate
          python tools/release_smoke.py
      - name: Retain image, wheel, bindings and digest for rollback
        run: |
          mkdir -p release
          docker cp cabiln-candidate:/opt/cabiln/dist release/dist
          docker cp cabiln-candidate:/opt/cabiln/release.json release/release.json
          docker cp cabiln-candidate:/opt/cabiln/dependency-install.json release/dependency-install.json
          docker image inspect cabiln-candidate --format '{{.Id}}' > release/image-id.txt
          docker save cabiln-candidate | gzip > release/cabiln-image.tar.gz
          sha256sum release/dist/*.whl release/cabiln-image.tar.gz > release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheel
          path: |
            release/dist
            release/release.json
            release/dependency-install.json
            release/image-id.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: release-image
          path: |
            release/cabiln-image.tar.gz
            release/SHA256SUMS
          retention-days: 30
      - name: Capture release logs
        if: always()
        run: docker logs cabiln-candidate > release-container.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-container-log
          path: release-container.log
      - name: Stop isolated container
        if: always()
        run: docker rm -f cabiln-candidate || true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install development and web dependencies
        run: python -m pip install -e ".[dev,web]"
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Test chemistry and web API
        run: python -m pytest -m "not distribution and not fuzz"

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install test and build tools
        run: python -m pip install pytest build
      - name: Build and test the installed distribution
        run: python -m pytest tests/test_distribution.py
