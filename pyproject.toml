[build-system]
requires = [
    "setuptools>=77",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyPept"
version = "1.1.0b0"
description = "Chemistry-aware peptide notation, molecule assembly, and interactive builder"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-ORIGINAL"]
requires-python = ">=3.9"
classifiers = [
        "Intended Audience :: Science/Research",
        "Operating System :: MacOS :: MacOS X",
        "Operating System :: Microsoft :: Windows",
        "Operating System :: OS Independent",
        "Operating System :: POSIX :: Linux",
        "Programming Language :: Python",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.9",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: Implementation :: CPython",
        "Topic :: Scientific/Engineering :: Chemistry",
]
dynamic = [
    "dependencies",
    "optional-dependencies",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyPept*"]
namespaces = false

[tool.setuptools.package-data]
"pyPept.data" = ["*.txt", "*.csv", "*.json", "*.sdf", "*.yaml"]
"pyPept.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.json"]

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.dynamic.optional-dependencies]
dev = {file = "requirements-dev.txt"}
web = {file = "requirements-web.txt"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["distribution: builds and installs the wheel in a clean environment"]

[tool.black]
target-version = ["py39"]

[tool.bumpver]
current_version = "1.1.0b0"
version_pattern = "MAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message  = "Bump version {old_version} -> {new_version}"
commit          = true
tag             = true
push            = true

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']

[project.scripts]
run_pyPept              = "pyPept.interfaces.run_pyPept:main"
pyPept-BILN-validate    = "pyPept.interfaces.cli_BILN_validityChecker:run_as_standalone"
pyPept-monomer-add      = "pyPept.interfaces.cli_monomer:main"
cabiln                 = "pyPept.web.app:main"
